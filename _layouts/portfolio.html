<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ site.title | escape }}{% if page.title %} · {{ page.title | escape }}{% endif %}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:image" content="{{ '/images/personal.png' | absolute_url }}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
<script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><nav class="nav-shell" aria-label="Main navigation">
<a class="wordmark" href="{{ '/' | relative_url }}">George Dasoulas</a>
<div class="nav-links"><a href="{{ '/#about' | relative_url }}">About</a><a href="{{ '/#research' | relative_url }}">Research</a><a href="{{ '/#publications' | relative_url }}">Publications</a><a href="{{ '/#experience' | relative_url }}">Experience</a><a href="{{ '/#news' | relative_url }}">News</a><a href="{{ '/cv/' | relative_url }}">CV <span aria-hidden="true">↗</span></a></div>
</nav></header>
<main id="main" class="page-shell {% unless page.portfolio_home %}interior{% endunless %}">{% unless page.portfolio_home %}<a class="back-link" href="{{ '/' | relative_url }}">← Back to overview</a><h1>{{ page.title }}</h1>{% endunless %}{{ content }}</main>
<footer class="site-footer"><div><span>© {{ site.time | date: '%Y' }} George Dasoulas</span><a href="https://scholar.google.com/citations?user=WPFAXNAAAAAJ">Google Scholar ↗</a><a href="https://www.linkedin.com/in/george-dasoulas-23369786">LinkedIn ↗</a><a href="#main">Back to top ↑</a></div></footer>
</body></html>
